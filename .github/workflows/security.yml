name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # еженедельно, пн 06:00 UTC — ловим новые CVE в неизменном коде
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # для загрузки SARIF в Security tab

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # весь история — ловим секреты в прошлых коммитах (был инцидент дампов)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  filesystem-scan:
    name: Trivy FS + IaC (config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem (deps + secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
        if: always()

  container-scan:
    name: Trivy image (overlay) + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build overlay image
        run: docker build -t remnashop-overlay:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: remnashop-overlay:ci
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
        if: always()
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: remnashop-overlay:ci
          format: spdx-json
          artifact-name: sbom-overlay.spdx.json
