name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Cabinet — build / lint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cabinet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, а не 20: GitHub объявил Node 20 на раннерах устаревшим. Собственно
          # предупреждение было про среду САМИХ экшенов (её лечит переход на v5),
          # но держать сборку на снимаемой версии смысла нет — на 22 проверено.
          node-version: "22"
          cache: npm
          cache-dependency-path: cabinet/package-lock.json
      - name: Install (clean)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test --if-present
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true  # видимость, не блокируем (транзитивные фиксы бывают отложены)

  backend:
    name: Бэкенд — тесты overlay
    runs-on: ubuntu-latest

    # Одноразовый Postgres для opt-in тестов (RS_PG_DSN). Без него около сотни тестов
    # пропускались МОЛЧА — а среди них денежные пути (идемпотентность платежа, перенос
    # остатка при смене тарифа, докупка устройств и трафика, подарки, возвраты) и
    # уникальные индексы, то есть ровно то, что на подделанной сессии не проверить.
    # Зелёный CI с сотней пропусков выглядел как «всё проверено», а проверено не было.
    #
    # Имена — как у базы бота (DATABASE_USER/NAME по умолчанию remnashop), пароль —
    # DATABASE_PASSWORD из ci.env: так миграции бота ниже идут без лишних настроек.
    # База живёт только в этой job, пароль — заглушка, а не секрет. Runner ждёт
    # healthcheck (pg_isready) до первого шага — гонки «тесты раньше базы» нет.
    #
    # Сеть. Тесты идут не на самом раннере, а в `docker run`, и `localhost` там —
    # контейнер тестов, а не база. Поэтому контейнеры шагов ниже запускаются в той
    # же docker-сети, которую runner создал для сервисов этой job
    # (`job.services.postgres.network`): в ней база доступна по имени сервиса,
    # `postgres`, — runner вешает на её контейнер такой сетевой алиас. Порт на хост
    # не публикуем, --network host не нужен. Локально — тот же приём:
    # `docker network create …` и `--network-alias postgres` у контейнера базы.
    # Контекст `job` доступен только в шагах (не в env уровня job) — поэтому сеть
    # подставлена прямо в команды.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: remnashop
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: remnashop
        options: >-
          --health-cmd "pg_isready -U remnashop -d remnashop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      # Тесты импортируют src.* — исходники бота живут ТОЛЬКО внутри образа
      # (COPY admin_src/src поверх ghcr.io/snoups/remnashop). Без сборки их
      # неоткуда взять, поэтому гоняем внутри образа, как и локально.
      - name: Собрать образ
        run: docker build -t remnashop-ci .

      # Значения ЗАВЕДОМО фальшивые и секретами не являются: AppConfig валидирует
      # их на импорте, и без них три теста падают ещё на сборе.
      #
      # APP_CRYPT_KEY — 32 НУЛЕВЫХ байта в base64, и это НАМЕРЕННО, а не лень.
      # Валидатору нужен ровно 44-символьный base64, но случайный ключ имеет
      # высокую энтропию, и gitleaks в соседнем workflow принимает его за
      # настоящий (проверено: падал именно на этой строке, generic-api-key).
      # Ключ из нулей валидатор принимает, а сканер не трогает. Не заменяйте на
      # `openssl rand` — сломаете проверку секретов.
      - name: Окружение тестов
        run: |
          cat > ci.env <<'ENV'
          APP_DOMAIN=example.test
          APP_CRYPT_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BOT_TOKEN=123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          BOT_SECRET_TOKEN=ci-secret
          BOT_OWNER_ID=1
          BOT_SUPPORT_USERNAME=ci_support
          REMNAWAVE_HOST=remnawave
          REMNAWAVE_TOKEN=ci-token
          REMNAWAVE_WEBHOOK_SECRET=ci-webhook-secret
          DATABASE_PASSWORD=ci
          APP_API_KEY=ci-api-key
          APP_JWT_SECRET=ci-jwt-secret
          ENV

      # Схема — настоящими миграциями бота (база + overlay), как при старте
      # контейнера. Часть тестов нарочно сверяется с РЕАЛЬНОЙ схемой, а не со своей
      # копией: test_payment_idempotency ищет enum transaction_status и уникальный
      # индекс payment_id — на пустой базе семь его тестов падают, а не пропускаются.
      # Заодно это проверка, что цепочка миграций проходит на чистом Postgres, то есть
      # что свежая установка вообще поднимется.
      - name: Схема базы (миграции бота)
        run: |
          docker run --rm --env-file ci.env --network "${{ job.services.postgres.network }}" \
            -e DATABASE_HOST=postgres remnashop-ci \
            alembic -c src/infrastructure/database/alembic.ini upgrade head

      # Одна строка DSN годится обоим видам тестов: admin_src/tests/_pg_dsn.py сам
      # приводит её к виду для asyncpg или для SQLAlchemy.
      - name: Тесты
        run: |
          docker run --rm --env-file ci.env \
            --network "${{ job.services.postgres.network }}" \
            -e RS_PG_DSN=postgresql://remnashop:ci@postgres:5432/remnashop \
            -v "$PWD/admin_src/tests:/tmp/tests:ro" \
            -v "$PWD/admin_src:/tmp/admin_src:ro" remnashop-ci \
            sh -c 'pip install -q --target /tmp/pylibs pytest pytest-asyncio &&
                   PYTHONPATH=/tmp/pylibs python -m pytest /tmp/tests -q \
                     --asyncio-mode=auto -p no:cacheprovider'

      # Правки overlay применяются к базе в рантайме. Гейт ловит и то, что
      # апстрим изменил цель (expect_source), и то, что наша замена не найдёт свои
      # имена (expect_names_resolve) — именно так 23.08 уехал NameError, из-за
      # которого месяц не активировался ни один промокод.
      - name: Правки overlay применяются
        run: |
          docker run --rm --env-file ci.env remnashop-ci python -c "
          import sys, overlay_patches as op, src.overlay_app as m
          m.application()
          bad = False
          for name, why in op.failures():
              print(f'НЕ ПРИМЕНИЛАСЬ: {name}: {why}', file=sys.stderr); bad = True
          for module in op.pending():
              print(f'НЕ СРАБОТАЛА: никто не импортировал {module}', file=sys.stderr); bad = True
          print(f'применено правок: {len(op.applied())}')
          sys.exit(1 if bad else 0)
          "

  update-sh:
    name: update.sh — ветвление без docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # -S error — только настоящие ошибки (синтаксис, неверные конструкции): стиль
      # скрипта, который владелец запускает на проде, CI не блокирует.
      - name: shellcheck
        run: shellcheck -S error update.sh install.sh site-install.sh scripts/thanks.sh scripts/tests/update-sh.sh scripts/_env.sh scripts/db-backup.sh scripts/db-restore-verify.sh scripts/tests/db-backup.sh

      # Сценарии «обновить и бота / только кабинет», флаги, сервер кабинета, режим api,
      # перезапуск тарбол-ветки. docker, git и curl подменены — ничего не собирается.
      # Полное обновление сверяется с золотым журналом байт в байт.
      - name: Сценарии
        run: bash scripts/tests/update-sh.sh

      # Ежедневный бэкап: копия в закрытый Telegram-канал уходит только зашифрованной,
      # токен и прокси не попадают в аргументы процесса, сбой отправки бэкап не роняет,
      # проверка восстановления читает пароль из .env так же, как бэкап.
      - name: Бэкап — сценарии
        run: bash scripts/tests/db-backup.sh

  adapter:
    name: Адаптер «Бедолага» — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `compose.py` тянет httpx и fastapi — они есть только внутри образа
      # адаптера, поэтому тесты гоняем там же, как и тесты бэкенда.
      - name: Собрать образ адаптера
        run: docker build -t remnashop-adapter-ci adapter

      # Что именно заперто: перевод условий реферальной программы чужого бота.
      # Их v4.5 завела вторую схему наград, при которой прежний процент не
      # платится вовсе, — и кабинет месяцами показывал бы человеку награду,
      # которой он не получит. Обещание денег обязано быть под тестом.
      - name: Тесты
        run: |
          docker run --rm -v "$PWD/adapter/tests:/tmp/tests:ro" remnashop-adapter-ci \
            sh -c 'pip install -q --target /tmp/pylibs pytest &&
                   PYTHONPATH=/tmp/pylibs python -m pytest /tmp/tests -q -p no:cacheprovider'
