name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Cabinet — build / lint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cabinet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, а не 20: GitHub объявил Node 20 на раннерах устаревшим. Собственно
          # предупреждение было про среду САМИХ экшенов (её лечит переход на v5),
          # но держать сборку на снимаемой версии смысла нет — на 22 проверено.
          node-version: "22"
          cache: npm
          cache-dependency-path: cabinet/package-lock.json
      - name: Install (clean)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test --if-present
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true  # видимость, не блокируем (транзитивные фиксы бывают отложены)
