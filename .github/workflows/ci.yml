name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Cabinet — build / lint / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cabinet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22, а не 20: GitHub объявил Node 20 на раннерах устаревшим. Собственно
          # предупреждение было про среду САМИХ экшенов (её лечит переход на v5),
          # но держать сборку на снимаемой версии смысла нет — на 22 проверено.
          node-version: "22"
          cache: npm
          cache-dependency-path: cabinet/package-lock.json
      - name: Install (clean)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + build
        run: npm run build
      - name: Unit tests
        run: npm test --if-present
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true  # видимость, не блокируем (транзитивные фиксы бывают отложены)

  backend:
    name: Бэкенд — тесты overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Тесты импортируют src.* — исходники бота живут ТОЛЬКО внутри образа
      # (COPY admin_src/src поверх ghcr.io/snoups/remnashop). Без сборки их
      # неоткуда взять, поэтому гоняем внутри образа, как и локально.
      - name: Собрать образ
        run: docker build -t remnashop-ci .

      # Значения ЗАВЕДОМО фальшивые и секретами не являются: AppConfig валидирует
      # их на импорте, и без них три теста падают ещё на сборе.
      #
      # APP_CRYPT_KEY — 32 НУЛЕВЫХ байта в base64, и это НАМЕРЕННО, а не лень.
      # Валидатору нужен ровно 44-символьный base64, но случайный ключ имеет
      # высокую энтропию, и gitleaks в соседнем workflow принимает его за
      # настоящий (проверено: падал именно на этой строке, generic-api-key).
      # Ключ из нулей валидатор принимает, а сканер не трогает. Не заменяйте на
      # `openssl rand` — сломаете проверку секретов.
      - name: Тесты
        run: |
          cat > ci.env <<'ENV'
          APP_DOMAIN=example.test
          APP_CRYPT_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BOT_TOKEN=123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          BOT_SECRET_TOKEN=ci-secret
          BOT_OWNER_ID=1
          BOT_SUPPORT_USERNAME=ci_support
          REMNAWAVE_HOST=remnawave
          REMNAWAVE_TOKEN=ci-token
          REMNAWAVE_WEBHOOK_SECRET=ci-webhook-secret
          DATABASE_PASSWORD=ci
          APP_API_KEY=ci-api-key
          APP_JWT_SECRET=ci-jwt-secret
          ENV
          docker run --rm --env-file ci.env \
            -v "$PWD/admin_src/tests:/tmp/tests:ro" remnashop-ci \
            sh -c 'pip install -q --target /tmp/pylibs pytest pytest-asyncio &&
                   PYTHONPATH=/tmp/pylibs python -m pytest /tmp/tests -q \
                     --asyncio-mode=auto -p no:cacheprovider'

      # Правки overlay применяются к базе в рантайме. Гейт ловит и то, что
      # апстрим изменил цель (expect_source), и то, что наша замена не найдёт свои
      # имена (expect_names_resolve) — именно так 23.08 уехал NameError, из-за
      # которого месяц не активировался ни один промокод.
      - name: Правки overlay применяются
        run: |
          docker run --rm --env-file ci.env remnashop-ci python -c "
          import sys, overlay_patches as op, src.overlay_app as m
          m.application()
          bad = False
          for name, why in op.failures():
              print(f'НЕ ПРИМЕНИЛАСЬ: {name}: {why}', file=sys.stderr); bad = True
          for module in op.pending():
              print(f'НЕ СРАБОТАЛА: никто не импортировал {module}', file=sys.stderr); bad = True
          print(f'применено правок: {len(op.applied())}')
          sys.exit(1 if bad else 0)
          "

  adapter:
    name: Адаптер «Бедолага» — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `compose.py` тянет httpx и fastapi — они есть только внутри образа
      # адаптера, поэтому тесты гоняем там же, как и тесты бэкенда.
      - name: Собрать образ адаптера
        run: docker build -t remnashop-adapter-ci adapter

      # Что именно заперто: перевод условий реферальной программы чужого бота.
      # Их v4.5 завела вторую схему наград, при которой прежний процент не
      # платится вовсе, — и кабинет месяцами показывал бы человеку награду,
      # которой он не получит. Обещание денег обязано быть под тестом.
      - name: Тесты
        run: |
          docker run --rm -v "$PWD/adapter/tests:/tmp/tests:ro" remnashop-adapter-ci \
            sh -c 'pip install -q --target /tmp/pylibs pytest &&
                   PYTHONPATH=/tmp/pylibs python -m pytest /tmp/tests -q -p no:cacheprovider'
