# ВНИМАНИЕ: этот файл — ШАБЛОН nginx (envsubst). Он монтируется/копируется в
# /etc/nginx/templates/default.conf.template, и при старте контейнера официальный
# entrypoint nginx подставляет переменные окружения вида ${API_*} (фильтр
# NGINX_ENVSUBST_FILTER=^API_ в Dockerfile — трогаются ТОЛЬКО переменные с
# префиксом API_, рантайм-переменные nginx ($host, $remote_addr, …) не затрагиваются).
#
#   ${API_UPSTREAM}    — адрес бэкенда бота в формате host:port.
#   ${API_SCHEME}      — http | https (как стучаться к апстриму).
#   ${API_HOST_HEADER} — Host-заголовок и TLS-SNI, отправляемые апстриму.
#
#   Два сценария:
#     • один сервер с ботом (по умолчанию):
#         API_UPSTREAM=remnashop:5000  API_SCHEME=http  API_HOST_HEADER=$host
#         (бот в той же docker-сети, ходим по имени контейнера)
#     • сайт на ОТДЕЛЬНОМ сервере — проксируем на ПУБЛИЧНЫЙ API бота по TLS
#       (никакого WG не нужно, API бота уже опубликован через его reverse-proxy):
#         API_UPSTREAM=bot.example.com:443  API_SCHEME=https  API_HOST_HEADER=bot.example.com
#   Значения задаются через env (см. docker-compose.cabinet.yml / .site.yml, install.sh).
#
# ── real_ip: реальный клиентский IP из-за фронт-прокси ───────────────────────
# Кабинет стоит за фронт-прокси (Caddy). Без real_ip $remote_addr = IP прокси для ВСЕХ
# запросов → per-IP rate-limit не работал бы (все юзеры под одним ключом: один брутфорсер
# ловил бы 429 всем = DoS авторизации). Доверяем приватным подсетям (docker/loopback, где
# сидит прокси) и берём реальный IP из X-Forwarded-For (recursive — пропуская доверенные
# хопы справа налево). ВАЖНО для безопасности: после этого $remote_addr/X-Real-IP —
# доверенные (бэкенд берёт IP входов/allowlist из X-Real-IP, а не из клиентского XFF).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── Рейт-лимит авторизации (защита от брутфорса) ─────────────────────────────
# Директивы http-контекста (файл включается в http{} через conf.d/*.conf), ВНЕ server{}.
# Лимитируем только брутфорсимые auth-ручки; частые легитимные (/auth/me, /refresh,
# /whoami, /logout) НЕ лимитируем. Ключ $auth_limit_key выставляется В ЛОКЕЙШЕНАХ по $uri
# (НОРМАЛИЗОВАННЫЙ путь: слэши схлопнуты, /./ и /../ разрешены ДО матчинга), поэтому обходы
# `//api/auth/login` / `/api/./auth/login` НЕ проходят мимо лимита (прежний map по сырому
# $request_uri их пропускал). Пустой ключ → запрос не считается.
limit_req_zone $auth_limit_key zone=auth_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Нужен, чтобы proxy_pass с переменной резолвил имя
    # контейнера динамически (на каждый запрос), а не один раз при старте nginx.
    # Это устраняет 502 после пересоздания контейнера remnashop (смена IP).
    # Для сайта на отдельном сервере, где API_UPSTREAM — это IP (напр. WG-адрес),
    # DNS не нужен, но директива безвредна (для IP-литерала запрос к DNS не идёт).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Заголовки безопасности. Кабинет = auth+платежи → анти-clickjacking обязателен.
    # frame-ancestors разрешает фрейминг ТОЛЬКО себе и Telegram (кабинет — Mini App),
    # иначе злоумышленник встроил бы кабинет в iframe и обманом собрал клики (удалить
    # аккаунт / выключить 2FA / подтвердить оплату). object-src/base-uri — hardening
    # инъекций. script/connect/img НЕ ограничиваем (чтобы не сломать SPA/мини-апп/QR —
    # строгий script-src с nonce можно ввести отдельным проходом). always — на все коды.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; object-src 'none'; base-uri 'none'" always;

    # Admin API — более специфичный префикс нужно указать ПЕРВЫМ.
    location /api/admin/ {
        # Ключ лимита по НОРМАЛИЗОВАННОМУ $uri (обход через слэши/точки невозможен):
        # считаем только /api/admin/2fa/* (брутфорс TOTP со stolen-сессии).
        set $auth_limit_key "";
        if ($uri ~ "^/api/admin/2fa") { set $auth_limit_key $binary_remote_addr; }
        limit_req zone=auth_limit burst=5 nodelay;
        # Загрузка логотипа кабинета (multipart) — дефолтный 1m мал.
        client_max_body_size 4m;
        set $upstream_remnashop "${API_UPSTREAM}";
        rewrite ^/api/admin/(.*)$ /api/v1/admin/$1 break;
        proxy_pass ${API_SCHEME}://$upstream_remnashop;
        # Для https-апстрима (сайт на отдельном сервере): SNI + правильный Host,
        # чтобы reverse-proxy бота смаршрутизировал по домену. В http игнорируется.
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST_HEADER};
        proxy_set_header Host ${API_HOST_HEADER};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Проксируем все API-запросы на бэкенд бота (${API_UPSTREAM}).
    # На одном сервере с ботом это имя контейнера remnashop:5000 (та же docker-сеть,
    # см. docker-compose.cabinet.yml). На отдельном сервере — IP/host бота:5000.
    location /api/ {
        # Ключ лимита по НОРМАЛИЗОВАННОМУ $uri (обход слэшами/точками невозможен):
        # брутфорсимые auth-ручки + активация промо. burst=5 nodelay, дальше 429.
        set $auth_limit_key "";
        if ($uri ~ "^/api/(auth/(login|register|password/reset|password/set|change-password|telegram|email/confirm|email/request-verification)|promocode/activate|support/tickets|push/(subscribe|test))") {
            set $auth_limit_key $binary_remote_addr;
        }
        limit_req zone=auth_limit burst=5 nodelay;

        set $upstream_remnashop "${API_UPSTREAM}";
        rewrite ^/api/(.*)$ /api/v1/public/$1 break;
        proxy_pass ${API_SCHEME}://$upstream_remnashop;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST_HEADER};
        proxy_set_header Host ${API_HOST_HEADER};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # cookie-based auth — куки должны проходить как есть
        proxy_pass_request_headers on;
    }

    # Крипто-ссылки подписки: /c/<opaque> → reverse-proxy бэкенда (тот же upstream,
    # что и /api/). Бэкенд резолвит алиас и серверно тянет реальный sub-URL. Работает
    # и когда кабинет на ОТДЕЛЬНОМ сервере. Без rate-limit — это тянут VPN-приложения
    # (в т.ч. по profile-update-interval).
    location /c/ {
        set $upstream_remnashop "${API_UPSTREAM}";
        rewrite ^/c/(.*)$ /api/v1/public/c/$1 break;
        proxy_pass ${API_SCHEME}://$upstream_remnashop;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST_HEADER};
        proxy_set_header Host ${API_HOST_HEADER};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
    }

    # Кэшируем статику с хешами в имени файла (Vite добавляет хеш автоматически)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html НЕ кэшируем — иначе после деплоя клиент (особенно Telegram Mini App)
    # держит старый HTML со ссылками на старый бандл, и обновление «залипает».
    # Сам HTML крошечный; хэшированные /assets/ по-прежнему кэшируются на год.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Повтор security-заголовков: add_header НЕ наследуется, если у location есть свой
        # add_header, а SPA-роуты через try_files приземляются именно сюда (это HTML-документ,
        # где и важен анти-clickjacking).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; object-src 'none'; base-uri 'none'" always;
    }

    # Service worker и PWA-манифест — без агрессивного кэша, чтобы обновления SW
    # и смена бренда в манифесте подхватывались браузером (файлы крошечные).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: все остальные пути отдаём на index.html, роутинг берёт на себя React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
