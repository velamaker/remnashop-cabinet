# Адаптер «кабинет ↔ бот Бедолага» для установки САЙТА (кабинет отдельно от бота).
# Подключается установщиком только при выборе бэкенда «Бедолага»:
#
#   docker compose -f cabinet/docker-compose.site.yml \
#                  -f cabinet/docker-compose.site-adapter.yml up -d --build
#
# Отличие от одно-серверного файла: там адаптер живёт в общей сети бота
# (remnawave-network), здесь сеть своя, а до бота он ходит по публичному адресу.

services:
  cabinet-adapter:
    build:
      # В site-режиме compose запускают одним -f из cabinet/, поэтому корень
      # проекта — сама папка cabinet, а адаптер лежит рядом с ней.
      context: ../adapter
    container_name: "${ADAPTER_CONTAINER:-remnashop-cabinet-adapter}"
    restart: unless-stopped
    environment:
      # Полный адрес API бота Бедолага со схемой (публичный домен или host:port).
      BEDOLAGA_UPSTREAM: "${BEDOLAGA_UPSTREAM:?set BEDOLAGA_UPSTREAM, e.g. https://bot.example.com}"
      # Их админский токен — только для того, что кабинет умеет, а их бот нет
      # (заморозка подписки). Пусто — раздел честно скрыт.
      BEDOLAGA_ADMIN_TOKEN: "${BEDOLAGA_ADMIN_TOKEN:-}"
      # Панель Remnawave: серверы, трафик и устройства принадлежат ей, а не боту.
      REMNAWAVE_URL: "${REMNAWAVE_URL:-${REMNAWAVE_API_URL:-${REMNAWAVE_HOST:-}}}"
      REMNAWAVE_TOKEN: "${REMNAWAVE_TOKEN:-${REMNAWAVE_API_KEY:-}}"
    volumes:
      - adapter-state:/data

volumes:
  adapter-state:
